[tox]
requires = tox>=4
envlist = test-unit,test-integration,ruff,djlint,bandit,black

[testenv]
package = skip
use_current_env = true

[testenv:test]
skip_install = true
commands =
    {[testenv:test-unit]commands}
    {[testenv:test-integration]commands}
allowlist_externals = pytest

[testenv:test-unit]
commands = pytest -m unmarked {posargs:cbng_reporter}
allowlist_externals = pytest

[testenv:test-integration]
commands = pytest -m integration {posargs:cbng_reporter}
allowlist_externals = pytest

[testenv:black]
commands = black --check {posargs:cbng_reporter}
allowlist_externals = black

[testenv:ruff]
commands = ruff check {posargs:cbng_reporter}
allowlist_externals = ruff

[testenv:djlint]
commands = djlint {posargs:cbng_reporter}
allowlist_externals = djlint --check

[testenv:bandit]
commands = bandit -r {posargs:cbng_reporter}
allowlist_externals = bandit
