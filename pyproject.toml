[project]
name = "reporter"
requires-python = ">=3.15"
dependencies = [
    "Django>=6.0.9,<6.1",
    "social-auth-app-django>=7.2.0",
    "mysqlclient>=2.3.0",
    "requests>=2.34.2",
    "deepmerge>=4.0.0",
    "django_bootstrap5>=26.4",
    "PyYAML>=6.0.3",
    "uvicorn>=0.54.0",
    "whitenoise>=6.12.0",
    "redis>=8.1.0",
    "prometheus-client>=0.26.0",
    "django-prometheus>=2.5.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.test.dependencies]
tox = ">=4.67.4"
tox-current-env = ">=0.0.17"
black = ">=26.10.1"
ruff = ">=0.17.3"
djlint = ">=1.47.1"
bandit = ">=1.9.4"
pytest-django = ">=4.14.0"
pytest = ">=9.2.0"
freezegun = ">=1.5.5"

[tool.ruff]
exclude = ['*/migrations/*', 've/*', '.tox/*']
line-length = 120

[tool.djlint]
profile = 'django'
use_gitignore = true
max_attribute_length = 120

[tool.black]
line-length = 120
extend-exclude = '''
(
  ^/ve
  |
  ^.*/migrations/.*
)
'''

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cbng_reporter.settings"
addopts = "--strict-markers"
markers = [
    "unmarked",
    "integration",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
